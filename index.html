
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body-wrap {
    display: block;
  }

  .page {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a2540 0%, #0d3d6b 40%, #0a5c8a 70%, #0e7490 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 48px 24px 64px;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .page::before {
    content: '';
    position: absolute;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(56,189,248,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  .page::after {
    content: '';
    position: absolute;
    bottom: -150px; right: -150px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(14,116,144,0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  .orb1 {
    position: absolute;
    top: 80px; right: -80px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(56,189,248,0.12) 0%, transparent 65%);
    pointer-events: none;
  }

  .card {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
  }

  .glass-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 32px;
  }

  .logo-ring {
    width: 96px;
    height: 96px;
    border-radius: 28px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .logo-ring img {
    width: 80px;
    height: 80px;
    object-fit: contain;
  }

  .brand-name {
    font-size: 26px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .brand-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .links-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  .glass-link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 18px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 4px 24px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.20);
    text-decoration: none;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .glass-link::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  }

  .glass-link:hover {
    background: rgba(255,255,255,0.17);
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 8px 32px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.25);
  }

  .glass-link:active {
    transform: scale(0.98);
  }

  .link-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
  }

  .icon-ig { background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
  .icon-mail { background: rgba(56,189,248,0.35); border: 1px solid rgba(56,189,248,0.4); }
  .icon-web { background: rgba(16,185,129,0.3); border: 1px solid rgba(16,185,129,0.4); }
  .icon-phone { background: rgba(99,102,241,0.35); border: 1px solid rgba(99,102,241,0.4); }

  .link-text {
    flex: 1;
  }

  .link-label {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .link-value {
    font-size: 14px;
    font-weight: 500;
    color: #fff;
  }

  .link-arrow {
    font-size: 16px;
    color: rgba(255,255,255,0.4);
    flex-shrink: 0;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 8px 0;
  }

  .footer {
    margin-top: 40px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.3px;
    position: relative;
    z-index: 1;
  }

  .qr-hint {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    position: relative;
    z-index: 1;
    max-width: 400px;
    width: 100%;
  }
</style>
